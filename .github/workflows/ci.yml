name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  landing:
    name: pricing, signup, and static files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Syntax-check scripts
        run: |
          node --check assets/app.js
          node --check assets/signup.js
          node --check assets/sample-report.js
          node --check functions/_middleware.js

      - name: Pricing and signup tests
        run: node --test tests/pricing-and-signup.test.mjs

      - name: Static site validation
        run: node --test tests/static-site.test.mjs
